version: '3.8'

services:
  mysql:
    image: mysql:8.3
    container_name: meu-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: zheiri
      MYSQL_DATABASE: servicos
      MYSQL_USER: root
      MYSQL_PASSWORD:

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - app-network

  app:
    build: .
    container_name: meu-app
    restart: on-failure

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/servicos?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: zheiri123

    depends_on:
      - mysql

    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge